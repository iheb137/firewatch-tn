# Module A — prédiction de propagation à J+1 (TensorFlow)
# Surcharge en ligne de commande : --set train.epochs=5 model.name=attention_unet

seed: 42

data:
  data_dir: data/raw/ndws          # dossier contenant les .tfrecord Kaggle
  batch_size: 64
  train_crop: 32                   # recadrage aléatoire (null = tuile 64×64)
  eval_crop: null                  # évaluation sur la tuile complète
  augment: true                    # rotations/miroirs avec correction du vent
  shuffle_buffer: 2048
  cache: true

model:
  name: res_unet                   # res_unet | attention_unet | logreg
  filters: [32, 64, 128]
  dropout: 0.1
  l2: 1.0e-5

loss:
  pos_weight: 3.0
  dice_weight: 1.0

train:
  epochs: 60
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  early_stopping_patience: 10
  mixed_precision: false           # true sur GPU récent (T4, A100…)
  output_dir: runs/spread_tf

mc_dropout:
  samples: 20
