# Lancement : make up   (ou : docker compose -f deploy/docker-compose.yml up --build)
name: firewatch-tn

services:
  api:
    build: { context: .., dockerfile: services/api/Dockerfile }
    ports: ["8000:8000"]
    environment:
      SPREAD_SERVICE_URL: http://spread-service:8000
      BURN_SERVICE_URL: http://burn-service:8000
      CORS_ORIGINS: http://localhost:5173
    depends_on: [spread-service, burn-service]

  spread-service:
    build: { context: .., dockerfile: services/spread-service/Dockerfile }
    environment: { MODEL_DIR: /models/spread }
    volumes: ["../models:/models:ro"]

  burn-service:
    build: { context: .., dockerfile: services/burn-service/Dockerfile }
    environment: { MODEL_PATH: /models/burn/best.pt }
    volumes: ["../models:/models:ro"]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: ["mlflow:/mlflow"]

  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: firewatch
      POSTGRES_USER: firewatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-firewatch-dev}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firewatch"]
      interval: 10s

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: firewatch
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-firewatch-dev}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/data"]

volumes:
  mlflow:
  pgdata:
  minio:
